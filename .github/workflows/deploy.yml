# 재사용 워크플로: 단일 앱(server | realtime)을 Cloud Run에 배포한다.
# - 빌드는 기존 cloudbuild.yaml(Cloud Build, linux/amd64)을 그대로 호출한다.
# - 이미지 태그는 커밋 short SHA를 사용한다.
# - server는 배포 전에 마이그레이션 Job(moneyroad-migrate)을 먼저 1회 실행한다.
# - Cloud Run 서비스/Job은 최초 1회 수동 생성되어 있어야 한다(시크릿·Cloud SQL·
#   특수 플래그 포함). 본 워크플로는 --image 만 갱신하므로 기존 설정을 보존한다.
#   최초 생성 절차는 apps/<app>/deploy/README.md 참고.
name: deploy (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: "배포 대상: server | realtime"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # Workload Identity Federation 용

env:
  PROJECT: moneyroad-app
  REGION: asia-northeast3
  AR_REPO: moneyroad
  MIGRATE_JOB: moneyroad-migrate

jobs:
  deploy:
    name: deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    # GitHub Environment 보호 규칙(승인/시크릿 분리)을 쓰려면 아래 주석을 해제.
    # environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image=${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${{ inputs.app }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image (Cloud Build)
        run: |
          if [ "${{ inputs.app }}" = "realtime" ]; then
            gcloud builds submit --config cloudbuild.yaml \
              --substitutions=_IMAGE=${{ steps.vars.outputs.image }},_DOCKERFILE=apps/realtime/Dockerfile
          else
            gcloud builds submit --config cloudbuild.yaml \
              --substitutions=_IMAGE=${{ steps.vars.outputs.image }}
          fi

      - name: Run DB migration (server only)
        if: inputs.app == 'server'
        run: |
          gcloud run jobs update "${MIGRATE_JOB}" \
            --image=${{ steps.vars.outputs.image }} --region="${REGION}"
          gcloud run jobs execute "${MIGRATE_JOB}" --region="${REGION}" --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "moneyroad-${{ inputs.app }}" \
            --image=${{ steps.vars.outputs.image }} --region="${REGION}"
