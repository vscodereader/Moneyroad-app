# native(Expo) 빌드 + 제출 / OTA(EAS Update)
# - 수동 실행 전용(workflow_dispatch).
# - action=build : EAS 서버 빌드(+선택적 스토어 제출). 스토어 버전이 생긴다.
# - action=ota   : eas update 로 JS/에셋만 즉시 배포(심사 X). 네이티브 변경엔 쓸 수 없다.
#                  fingerprint runtime 이 일치하는 "이미 배포된 빌드"에만 도달한다.
# - 실제 빌드/업데이트는 EAS 서버에서 수행. 러너는 eas-cli만 돌린다.
#
# 사전 준비(최초 1회): docs/deploy/native-google-play.md
#   - GitHub Secret: EXPO_TOKEN
name: native build & submit / OTA

on:
  workflow_dispatch:
    inputs:
      action:
        description: "작업 종류 (build=빌드/제출, ota=OTA 즉시 업데이트)"
        type: choice
        required: true
        default: build
        options:
          - build
          - ota
      platform:
        description: "[build] 빌드 플랫폼 (ota는 무시)"
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: "EAS 빌드 프로필 / [ota] 업데이트 대상 채널"
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
          - preview
      submit:
        description: "[build] 빌드 후 스토어 제출 여부 (ota는 무시)"
        type: boolean
        required: true
        default: true
      submit_track:
        description: "[build] 제출 트랙 (submit=true일 때)"
        type: choice
        required: true
        default: internal
        options:
          - internal
          - closed
          - open
          - production
      message:
        description: "[ota] 업데이트 메모 (비우면 커밋 SHA 사용)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.action }} ${{ inputs.profile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # eas-cli가 app.json config 플러그인을 로컬 평가하고,
      # OTA(eas update)도 metro 번들링에 의존성이 필요하므로 먼저 설치한다.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build / submit / OTA
        working-directory: apps/native
        env:
          OTA_MESSAGE: ${{ inputs.message }}
        run: |
          if [ "${{ inputs.action }}" = "ota" ]; then
            MSG="$OTA_MESSAGE"
            if [ -z "$MSG" ]; then MSG="OTA via workflow ($GITHUB_SHA)"; fi
            echo "eas update --branch ${{ inputs.profile }} --message \"$MSG\""
            eas update --branch "${{ inputs.profile }}" --message "$MSG" --non-interactive
          else
            FLAGS="--platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive"
            if [ "${{ inputs.submit }}" = "true" ]; then
              FLAGS="$FLAGS --auto-submit-with-profile ${{ inputs.submit_track }}"
            fi
            echo "eas build $FLAGS"
            eas build $FLAGS
          fi
