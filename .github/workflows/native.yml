# native(Expo) 빌드 + Google Play/App Store 제출
# - 수동 실행 전용(workflow_dispatch). 모바일은 빌드마다 EAS 비용 + 스토어 버전이
#   생기므로 push 자동 트리거는 두지 않는다.
# - 실제 빌드는 EAS 서버에서 수행된다. 러너는 eas-cli만 돌린다.
# - submit=true면 빌드 완료 후 eas.json의 submit_track 제출 프로필로 자동 제출한다
#   (internal=내부 / closed=비공개(Android alpha) / open=공개(Android beta) / production=정식).
#   iOS는 트랙 개념이 없어 어느 프로필이든 TestFlight 업로드까지만 한다. 외부(공개)
#   테스트 전환은 App Store Connect 콘솔에서 수동(외부 그룹 + 공개 링크 + 베타 심사).
#
# 사전 준비(최초 1회): docs/deploy/native-google-play.md
#   - GitHub Secret: EXPO_TOKEN
#   - Google Play 서비스계정 키를 EAS에 등록
#   - Play Console에 앱 생성 + 첫 AAB 1회 수동 업로드
name: native build & submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "빌드 플랫폼"
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: "EAS 빌드 프로필"
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
          - preview
      submit:
        description: "빌드 후 스토어 제출 여부"
        type: boolean
        required: true
        default: true
      submit_track:
        description: "제출 트랙 (submit=true일 때)"
        type: choice
        required: true
        default: internal
        options:
          - internal
          - closed
          - open
          - production

permissions:
  contents: read

jobs:
  build:
    name: build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # eas-cli가 업로드 전 app.json의 config 플러그인(expo-font 등)을 로컬에서
      # 평가하므로 워크스페이스 의존성을 먼저 설치해야 한다.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build (+ optional submit)
        working-directory: apps/native
        run: |
          FLAGS="--platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive"
          if [ "${{ inputs.submit }}" = "true" ]; then
            FLAGS="$FLAGS --auto-submit-with-profile ${{ inputs.submit_track }}"
          fi
          echo "eas build $FLAGS"
          eas build $FLAGS
